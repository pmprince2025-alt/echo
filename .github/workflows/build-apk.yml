name: Build Android APK

on:
  push:
    branches: [ "main", "master", "fix-build-errors" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant (e.g. mobileUniversalDebug, mobileArm64Debug)'
        required: true
        default: 'mobileUniversalDebug'

env:
  BUILD_VARIANT: ${{ inputs.build_variant || 'mobileUniversalDebug' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Setup google-services.json
      run: |
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
        else
          echo "No google-services.json secret set. Firebase features will be disabled."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assemble${{ env.BUILD_VARIANT }}

    - name: List APK output
      run: find app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK found"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: echo-music-${{ env.BUILD_VARIANT }}
        path: app/build/outputs/apk/**/*.apk
